<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>production-ai-app · Architecture</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--purple:#a371f7;--teal:#39d353;--coral:#ff7b72;--amber:#e3b341;--blue:#58a6ff;--pink:#f778ba;--green:#56d364}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;padding:24px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.subtitle{color:var(--text2);font-size:13px;margin-bottom:20px;display:flex;gap:8px;align-items:center}
.badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--text2)}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab.active{background:var(--blue);border-color:var(--blue);color:#000;font-weight:500}
.canvas{width:100%;overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.ng{cursor:pointer}
.ng rect{transition:filter .15s}
.ng:hover rect{filter:brightness(1.25)}
.detail{margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:80px}
.detail h3{font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text)}
.detail p{font-size:12px;color:var(--text2);line-height:1.6}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}
.tp{background:#2d2166;color:#a371f7}
.tt{background:#0d3320;color:#39d353}
.tc{background:#3d1210;color:#ff7b72}
.ta{background:#3d2c0a;color:#e3b341}
.tb{background:#0d2a45;color:#58a6ff}
.tk{background:#3d1630;color:#f778ba}
.tg{background:#21262d;color:#8b949e}
.constraint-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.c-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.c-card .icon{font-size:16px;margin-bottom:6px}
.c-card h4{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px}
.c-card p{font-size:11px;color:var(--text2);line-height:1.5}
</style>
</head>
<body>
<h1>production-ai-app</h1>
<div class="subtitle">
  <span>Production RAG Agent System</span>
  <span class="badge">FastAPI</span>
  <span class="badge">Docker</span>
  <span class="badge">OpenTelemetry</span>
  <span class="badge">Redis</span>
</div>
<div class="tabs">
  <button class="tab active" onclick="showView('flow',this)">Request flow</button>
  <button class="tab" onclick="showView('modules',this)">Module map</button>
  <button class="tab" onclick="showView('security',this)">Security layers</button>
  <button class="tab" onclick="showView('infra',this)">Infrastructure</button>
  <button class="tab" onclick="showView('constraints',this)">Constraints</button>
</div>
<div class="canvas" id="cv"></div>
<div class="detail">
  <h3 id="dt">Click any component to explore</h3>
  <p id="dd">This interactive diagram covers the full production-ai-app RAG system. Click any highlighted node to see its file, responsibilities, and implementation constraints.</p>
  <div class="tags" id="dtg"></div>
</div>

<script>
const D={
input_guard:{t:'app/security/input_guard.py',d:'First gate on every request. Validates and sanitizes user input. Blocks prompt injection patterns, enforces max token limits, detects jailbreak attempts via classifier + rule set. No request proceeds without passing this gate.',tags:[['Security guard','tc'],['Pre-LLM','ta'],['Every request','tg']]},
query_rewriter:{t:'app/services/query_rewriter.py',d:'Rewrites ambiguous or underspecified queries using an LLM. Supports HyDE (Hypothetical Document Embedding) for better dense retrieval alignment, and standalone question reformulation to resolve conversational pronouns.',tags:[['LLM call','tb'],['HyDE','tt'],['services/','tg']]},
semantic_cache:{t:'app/services/semantic_cache.py',d:'Embedding-based semantic cache. Computes cosine similarity of incoming query against cached embeddings in Redis. Cache hits short-circuit the entire pipeline. TTL and similarity threshold configurable via config.py.',tags:[['Redis','ta'],['Skip pipeline','tt'],['Configurable','tg']]},
query_router:{t:'app/services/query_router.py',d:'Rule-based + LLM-assisted routing determines retrieval path: vector DB, web search, code search, or direct LLM answer. All routing thresholds and rules live in config.py — zero hardcoded values.',tags:[['Routing','tt'],['LLM-assisted','tb'],['Configurable','tg']]},
hybrid_retriever:{t:'app/components/hybrid_retriever.py',d:'Hybrid search combining dense vector retrieval (pgvector or Pinecone) with sparse BM25 keyword retrieval. Results merged using Reciprocal Rank Fusion (RRF). Configurable top_k and alpha weight between dense/sparse legs.',tags:[['RRF fusion','tp'],['BM25 + Dense','tt'],['components/','tg']]},
document_grader:{t:'app/agents/document_grader.py',d:'LLM-based grader scores each retrieved document against the query — returns relevant / not_relevant with confidence. Filters out irrelevant documents before generation, directly reducing hallucination risk.',tags:[['LLM call','tb'],['Self-correcting','tp'],['agents/','tg']]},
reranker:{t:'app/components/reranker.py',d:'Cross-encoder reranking via ms-marco-MiniLM or Cohere Rerank API. Accepts query + graded candidates, returns scored and sorted list. Score thresholding prevents low-confidence docs from reaching the generator.',tags:[['Cross-encoder','tp'],['Threshold','ta'],['components/','tg']]},
adaptive_router:{t:'app/agents/adaptive_router.py',d:'Self-reflection agent. If graded documents are insufficient, triggers fallback mid-pipeline: web search, query rewrite + retry, or direct LLM answer. The system diagnoses and heals poor retrieval quality before generation.',tags:[['Self-healing','tp'],['Fallback loop','tc'],['agents/','tg']]},
rag_pipeline:{t:'app/services/rag_pipeline.py',d:'Top-level orchestrator: rewrite → route → retrieve → grade → rerank → generate. Returns a structured QueryResponse. Every stage emits an OpenTelemetry span. Fully async. Handles all fallback paths.',tags:[['Orchestrator','tb'],['OTel spans','tk'],['Async-first','tt']]},
output_filter:{t:'app/security/output_filter.py',d:'Post-generation guard. Checks LLM response for hallucination signals, PII leakage, and policy violations. Can trigger regeneration or serve a safe fallback response. Runs on every outgoing response.',tags:[['Security guard','tc'],['Every response','tp'],['Regen trigger','ta']]},
tracer:{t:'observability/tracer.py + cost_tracker.py',d:'OTel distributed tracing creates spans per stage with LLM attributes: model, tokens in/out, latency. Exports to Jaeger, Datadog, or Langfuse. cost_tracker.py logs token usage and estimated cost per request, per user, per stage.',tags:[['OTel','tk'],['Cost-aware','ta'],['Every LLM call','tg']]},
content_filter:{t:'app/security/content_filter.py',d:'Filters retrieved documents before the LLM sees them. Strips PII and toxic content using regex rules + an LLM classifier. Prevents poisoned or policy-violating context from affecting generation.',tags:[['Security guard','tc'],['Pre-generation','ta'],['security/','tg']]},
vector_search:{t:'app/agents/tools/vector_search.py',d:'Pluggable tool wrapper for vector DB retrieval. Returns List[Document] with metadata and similarity scores. Injectable interface — swap vector DB backends without changing any agent code.',tags:[['Pluggable','tp'],['Injectable','tt'],['tools/','tg']]},
web_search:{t:'app/agents/tools/web_search.py',d:'Live web search wrapper (Tavily, Serper, or Brave Search API). Returns structured results: URL, title, snippet. Used by adaptive_router as fallback when vector retrieval quality is too low.',tags:[['Fallback','tc'],['Pluggable','tp'],['tools/','tg']]},
code_search:{t:'app/agents/tools/code_search.py',d:'Code-specific search via GitHub API or local code index. Returns code snippets with file path and line references. Activated by query_router when query domain is detected as code.',tags:[['GitHub API','tb'],['Pluggable','tp'],['tools/','tg']]},
evaluation:{t:'evaluation/',d:'offline_eval.py runs RAGAS metrics (faithfulness, answer relevancy, context precision/recall) against golden_dataset.json. online_monitor.py samples live traffic async and scores quality in the background. All results versioned by git SHA in eval_results/.',tags:[['RAGAS metrics','tt'],['Versioned','ta'],['CI-ready','tb']]},
observability:{t:'observability/',d:'tracer.py (OTel spans per stage), feedback.py (thumbs up/down captured to Postgres/Redis), cost_tracker.py (per-request token + USD cost, daily/monthly aggregates, budget alerts). Every single LLM call logs tokens.',tags:[['OTel','tk'],['Feedback loop','tk'],['Cost tracking','ta']]},
frontend:{t:'frontend/',d:'Streamlit or Gradio chat UI containerized separately. Displays source citations, feedback buttons, conversation history, and per-request cost. Communicates with app/ over the internal Docker network.',tags:[['Separate container','tg'],['Feedback','tk'],['Gradio/Streamlit','tb']]},
conversation:{t:'app/services/conversation.py',d:'Per-session conversation history stored in Redis keyed by session_id. Implements sliding window or LLM-based summarization to stay within context window limits. Injects history into query_rewriter context.',tags:[['Redis','ta'],['Session-aware','tt'],['services/','tg']]},
prompts:{t:'app/prompts/templates.py + registry.py',d:'All prompt templates as typed dataclasses with system, user, and context_injection fields. Central registry loads by name and version. Supports hot-swapping without restart via config file watch or remote config.',tags:[['Hot-swappable','tt'],['Versioned','ta'],['prompts/','tg']]},
};

function pick(key){
  const d=D[key];if(!d)return;
  document.getElementById('dt').textContent=d.t;
  document.getElementById('dd').textContent=d.d;
  document.getElementById('dtg').innerHTML=d.tags.map(([l,c])=>`<span class="tag ${c}">${l}</span>`).join('');
}

<div class="c-card"><div class="icon">📡</div><h4>Observable</h4><p>Every pipeline stage emits an OpenTelemetry span with LLM-specific attributes: model, tokens in/out, latency, stage name.</p></div>
<div class="c-card"><div class="icon">🔧</div><h4>Configurable</h4><p>Zero hardcoded model names, thresholds, or API URLs. Everything flows through config.py loaded from environment variables.</p></div>
<div class="c-card"><div class="icon">🧪</div><h4>Testable</h4><p>All external services (LLM, vector DB, Redis, web search) are injectable and mockable. 80% coverage threshold enforced.</p></div>
<div class="c-card"><div class="icon">🛡️</div><h4>Secure</h4><p>input_guard.py and output_filter.py run on every request/response. No PII in logs. Three guard layers total.</p></div>
<div class="c-card"><div class="icon">💰</div><h4>Cost-aware</h4><p>Every LLM call logs token counts to cost_tracker.py. Per-request, per-user, per-stage aggregates. Budget alerts configurable.</p></div>
<div class="c-card"><div class="icon">🔄</div><h4>Self-healing</h4><p>adaptive_router.py detects poor retrieval quality mid-pipeline and triggers fallback paths before generation begins.</p></div>
</div>
</div>`
